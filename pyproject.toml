[project]
name = "clearclip-position-bias"
version = "0.1.0"
description = "Position-bias diagnosis and training-free correction for ClearCLIP dense inference"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "open_clip_torch>=2.24",
    "numpy>=1.24",
    "scipy>=1.11",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clearclip"]
